<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACEW Attendance</title>
<style>
  :root{
    --wine:#5C1A34;
    --wine-dark:#3E1123;
    --gold:#C9A227;
    --gold-light:#EADFB4;
    --cream:#FAF6EE;
    --ink:#2A2119;
    --muted:#8A7F6E;
    --green:#3F7D4F;
    --amber:#B9822A;
    --red:#B0332B;
    --line:#E7DCC4;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI', Inter, -apple-system, sans-serif;background:var(--cream);color:var(--ink);min-height:100vh;}
  .display{font-family:Georgia,'Times New Roman',serif;}
  .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--cream);position:relative;padding-bottom:40px;}
  header.top{background:linear-gradient(135deg,var(--wine) 0%,var(--wine-dark) 100%);color:#fff;padding:22px 20px 26px;position:relative;overflow:hidden;}
  header.top::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(201,162,39,0.15);}
  header.top .brandrow{display:flex;align-items:center;gap:12px;position:relative;z-index:1;}
  header.top .logo{width:52px;height:52px;border-radius:10px;background:#fff;padding:5px;flex-shrink:0;}
  header.top .logo img{width:100%;height:100%;object-fit:contain;}
  header.top h1{margin:0;font-size:16.5px;font-weight:700;line-height:1.25;}
  header.top p{margin:2px 0 0;font-size:11.5px;color:var(--gold-light);letter-spacing:.3px;}
  .subbar{padding:10px 20px;font-size:12px;color:var(--muted);border-bottom:1px solid var(--line);background:#fff;}
  main{padding:18px 18px 10px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .role-btn{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:16px 8px;text-align:center;cursor:pointer;transition:.15s;font-size:13px;font-weight:600;color:var(--ink);}
  .role-btn:hover{border-color:var(--gold);background:var(--gold-light);}
  .role-btn .emo{font-size:24px;display:block;margin-bottom:6px;}
  select,input[type=text],input[type=password],input[type=number],textarea{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:14.5px;background:#fff;color:var(--ink);margin-top:6px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:90px;}
  label{font-size:12.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
  .field{margin-bottom:14px;}
  .btn{display:block;width:100%;padding:13px;border:none;border-radius:10px;font-size:14.5px;font-weight:700;cursor:pointer;text-align:center;margin-top:8px;}
  .btn-primary{background:var(--wine);color:#fff;}
  .btn-primary:hover{background:var(--wine-dark);}
  .btn-gold{background:var(--gold);color:var(--wine-dark);}
  .btn-outline{background:#fff;border:1.5px solid var(--wine);color:var(--wine);}
  .btn-ghost{background:transparent;color:var(--muted);font-weight:600;font-size:12.5px;padding:8px;}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:5px 11px;border-radius:99px;}
  .pill-in{background:#E4F2E6;color:var(--green);}
  .pill-out{background:#FBE9E7;color:var(--red);}
  .pill-wait{background:#F3EFE3;color:var(--muted);}
  .locbox{border:1.5px dashed var(--line);border-radius:12px;padding:14px;text-align:center;margin-bottom:10px;}
  .locbox.ok{border-color:var(--green);background:#F3FAF4;}
  .locbox.bad{border-color:var(--red);background:#FDF3F2;}
  .dist{font-size:12px;color:var(--muted);margin-top:4px;}
  .backlink{color:var(--wine);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px;margin-bottom:14px;}
  .session-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px;}
  .sess-card{border:1.5px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center;}
  .sess-card h4{margin:0 0 6px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;}
  table{width:100%;border-collapse:collapse;font-size:12.8px;}
  th,td{padding:8px 6px;text-align:left;border-bottom:1px solid var(--line);}
  th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;}
  .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--gold-light);color:var(--wine-dark);}
  .grp-head{background:var(--wine);color:#fff;padding:8px 12px;border-radius:8px;font-weight:700;font-size:12.5px;margin:14px 0 8px;display:flex;justify-content:space-between;}
  .staffrow-name{font-weight:600;}
  .staffrow-sub{font-size:11px;color:var(--muted);}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--wine-dark);color:#fff;padding:12px 20px;border-radius:10px;font-size:13.5px;font-weight:600;z-index:99;box-shadow:0 6px 18px rgba(0,0,0,.25);max-width:90%;text-align:center;}
  .note{font-size:11.5px;color:var(--muted);line-height:1.5;margin-top:10px;}
  .warn{background:#FBF4E4;border:1px solid #E9D9A8;color:#7A5B10;padding:10px 12px;border-radius:9px;font-size:12px;line-height:1.5;}
  .spin{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:middle;margin-right:6px;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .empty{text-align:center;padding:30px 10px;color:var(--muted);font-size:13px;}
  .footer-note{text-align:center;font-size:10.5px;color:var(--muted);padding:16px 20px 4px;}
  .chiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}
  .chip{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;background:#fff;}
  .chip.active{background:var(--wine);color:#fff;border-color:var(--wine);}
  .delbtn{color:var(--red);font-size:11px;font-weight:700;cursor:pointer;}
  .stu-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);}
  .stu-name{font-size:13.5px;font-weight:600;}
  .togglebtn{display:flex;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;}
  .togglebtn div{padding:5px 12px;font-size:11.5px;font-weight:700;cursor:pointer;}
  .tp{color:var(--green);}
  .ta{color:var(--red);}
  .tp.on{background:#E4F2E6;}
  .ta.on{background:#FBE9E7;}
  .barwrap{margin-bottom:12px;}
  .barlabel{display:flex;justify-content:space-between;font-size:12px;font-weight:600;margin-bottom:4px;}
  .bartrack{height:14px;background:#F1EADA;border-radius:8px;overflow:hidden;}
  .barfill{height:100%;border-radius:8px;transition:.3s;}
  /* Loading screen */
  .loadwrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--wine) 0%,var(--wine-dark) 100%);color:#fff;padding:30px;}
  .loadlogo{width:110px;height:110px;border-radius:22px;background:#fff;padding:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);margin-bottom:22px;}
  .loadlogo img{width:100%;height:100%;object-fit:contain;}
  .loadtitle{font-size:17px;font-weight:700;text-align:center;line-height:1.4;margin-bottom:4px;}
  .loadsub{font-size:11.5px;color:var(--gold-light);text-align:center;margin-bottom:26px;letter-spacing:.4px;}
  .loadbar{width:220px;height:6px;background:rgba(255,255,255,.2);border-radius:4px;overflow:hidden;}
  .loadfill{height:100%;background:var(--gold);border-radius:4px;width:0%;}
  .loadpct{margin-top:10px;font-size:12px;color:var(--gold-light);font-weight:700;letter-spacing:.5px;}
</style>
</head>

let db=false;
const FB_SET = !!FIREBASE_CONFIG.projectId && !FIREBASE_CONFIG.projectId.startsWith("PASTE");
const FS_URL = k => `https://firestore.googleapis.com/v1/projects/${FIREBASE_CONFIG.projectId}/databases/(default)/documents/store/${encodeURIComponent(k)}?key=${FIREBASE_CONFIG.apiKey}`;
async function initStore(){
  if(!FB_SET) return;
  try{
    const r = await fetch(FS_URL("config"));
    db = (r.status===200 || r.status===404);
    if(!db) console.error("Firestore status", r.status, await r.text());
  }catch(e){ console.error("Firestore not reachable", e); db=false; }
}
const storeReady = initStore();
async function sget(key){
  await storeReady;
  try{
    if(db){
      const r = await fetch(FS_URL(key));
      if(r.status===404) return null;
      if(!r.ok) throw new Error("HTTP "+r.status);
      const d = await r.json(); return JSON.parse(d.fields.v.stringValue);
    }
    const v = localStorage.getItem("acew:"+key); return v? JSON.parse(v): null;
  }catch(e){ console.error(e); return null; }
}
async function sset(key, val){
  await storeReady;
  try{
    if(db){
      const r = await fetch(FS_URL(key), {method:"PATCH", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({fields:{v:{stringValue: JSON.stringify(val)}}})});
      if(!r.ok) console.error("save failed", r.status, await r.text());
      return r.ok;
    }
    localStorage.setItem("acew:"+key, JSON.stringify(val)); return true;
  }catch(e){ console.error(e); return false; }
}

function todayStr(){ const d=new Date(); return d.toISOString().slice(0,10); }
function nowTime(){ return new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'}); }

async function getConfig(){
  let c = await sget('config');
  if(!c){ c = { geofence:null, adminPin:"1234", hodPins:{}, classPins:{} }; await sset('config', c); }
  if(!c.classPins) c.classPins = {};
  return c;
}

async function markAttendance(staffId, session, coords){
  const date = todayStr();
  const key = `att:${date}:${staffId}`;
  let rec = await sget(key) || {staffId, date, morning:null, evening:null};
  rec[session] = { time: nowTime(), lat: coords.lat, lng: coords.lng };
  await sset(key, rec);
  return rec;
}

function haversine(lat1,lng1,lat2,lng2){
  const R=6371000, toRad=x=>x*Math.PI/180;
  const dLat=toRad(lat2-lat1), dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2 + Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function getLocation(){
  return new Promise((resolve,reject)=>{
    if(!navigator.geolocation){ reject(new Error("Geolocation not supported on this device.")); return; }
    navigator.geolocation.getCurrentPosition(
      pos=>resolve({lat:pos.coords.latitude, lng:pos.coords.longitude, acc:pos.coords.accuracy}),
      err=>reject(err), {enableHighAccuracy:true, timeout:12000, maximumAge:0}
    );
  });
}
async function checkInsideCampus(){
  const cfg = await getConfig();
  if(cfg.demoMode) return {ok:true, dist:0, radius:0, loc:{lat:0,lng:0}};
  if(!cfg.geofence) return {ok:false, reason:"nogeo"};
  try{
    const loc = await getLocation();
    const dist = haversine(loc.lat, loc.lng, cfg.geofence.lat, cfg.geofence.lng);
    return {ok:dist<=cfg.geofence.radius, dist, radius:cfg.geofence.radius, loc};
  }catch(e){ return {ok:false, reason:"gpserr", err:e}; }
}

  // student classes for this dept

  root(`

        <div class="grp-head"><span>Non-Teaching Staff</span><span>${nonteaching.length}</span></div>
        <table><thead><tr><th>Name</th><th>Morning</th><th>Evening</th></tr></thead>
        <tbody>${nonteaching.length? nonteaching.map(rowHtml).join(''): `<tr><td colspan="3" class="empty">None added</td></tr>`}</tbody></table>
      </div>
      <div class="card">
        <div class="grp-head"><span>Student Absentee Chart — ${dept}</span><span>${deptPct}% overall</span></div>
        <div class="barwrap">
          <div class="barlabel"><span>Overall Department</span><span>${deptAbsent}/${deptTotal} absent</span></div>
          <div class="bartrack"><div class="barfill" style="width:${deptPct}%;background:${barColor(deptPct)}"></div></div>
        </div>

async function inChunks(tasks,n=25){ for(let i=0;i<tasks.length;i+=n) await Promise.all(tasks.slice(i,i+n).map(f=>f())); }
window.seedSample = async ()=>{
  const btn=document.getElementById('seedBtn'); btn.disabled=true; btn.innerHTML='<span class="spin" style="border-top-color:var(--wine)"></span>Loading… wait 20-40 sec';
  const dates=[0,1,2,3,4].map(i=>new Date(Date.now()-i*864e5).toISOString().slice(0,10));
  const staff=[], classes=[], tasks=[]; let k=0;
  DEPARTMENTS.forEach((d,di)=>{ for(let i=0;i<8;i++){ const t=i<5?"Teaching":"Non-Teaching";
    staff.push({id:`s_${d.code}_${i}`, name:`${t==="Teaching"?"Dr. ":""}${FN[(di*5+i)%FN.length]} ${IN[(di+i)%IN.length]}`, dept:d.code, type:t}); } });

    morning:{time:"09:0"+(k++%9),lat:0,lng:0}, evening: di===0&&Math.random()<0.5? null : {time:"16:3"+(k%9),lat:0,lng:0}})); }));
  DEPARTMENTS.forEach((d,di)=>YEARS.forEach((y,yi)=>SECTIONS.forEach((sec,si)=>{
    const cid=classId(d.code,y,sec), n=30+((di+yi+si)*3)%15, rate=Math.random()*0.32+0.02;
    const stu=Array.from({length:n},(_,i)=>({id:cid+"-stu"+i, name:`${FN[(i*7+di+si)%FN.length]} ${IN[(i*3+yi)%IN.length]}`}));
    classes.push({id:cid,dept:d.code,year:y,section:sec,count:n});
    tasks.push(()=>saveClassStudents(cid,stu));
    dates.forEach(dt=>{ const m={}; stu.forEach(s=>m[s.id]=Math.random()<rate?'A':'P'); tasks.push(()=>saveStudentAtt(cid,dt,m)); });
  })));

window.saveGeofence = async ()=>{
  const mc = (document.getElementById('manualCoords')||{}).value || '';
  if(mc.trim()){
    const m = mc.split(/[ ,]+/).map(Number).filter(n=>!isNaN(n));
    if(m.length<2 || Math.abs(m[0])>90 || Math.abs(m[1])>180){ toast("Coordinates format wrong. Example: 8.17812, 77.43245"); return; }
    window._capturedLoc = {lat:m[0], lng:m[1], acc:0};
  }
  if(!window._capturedLoc){ toast("Paste coordinates or capture a location first"); return; }
  const radius = parseInt(document.getElementById('radiusInput').value)||200;
  const cfg = await getConfig();
  cfg.geofence = { lat:window._capturedLoc.lat, lng:window._capturedLoc.lng, radius };
  const ok = await sset('config', cfg);
  const back = await getConfig();
  if(!ok || !back.geofence){ toast("❌ Save FAILED — database not connected. Check Firebase setup."); return; }
  toast("Campus boundary saved ✓");
  go('admin-home');
};

async function renderAdminStaff(){
  const staff = await getStaffList();
  root(`
    ${Header("Manage Staff")}
    <main>
      ${backLink('admin-home')}
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;">Add Staff</div>
        <div class="field"><label>Name</label><input type="text" id="newName" placeholder="Full name"/></div>
        <div class="field"><label>Department</label><select id="newDept">${DEPARTMENTS.map(d=>`<option value="${d.code}">${d.code}</option>`).join('')}</select></div>
        <div class="field"><label>Staff Type</label><select id="newType"><option value="Teaching">Teaching</option><option value="Non-Teaching">Non-Teaching</option></select></div>
        <button class="btn btn-primary" onclick="addStaff()">+ Add Staff</button>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;">All Staff (${staff.length})</div>
        <table><thead><tr><th>Name</th><th>Dept</th><th>Type</th><th></th></tr></thead>
        <tbody>${staff.length? staff.map(s=>`<tr><td>${s.name}</td><td>${s.dept}</td><td>${s.type}</td><td><span class="delbtn" onclick="removeStaff('${s.id}')">Remove</span></td></tr>`).join(''): `<tr><td colspan="4" class="empty">No staff added yet</td></tr>`}</tbody></table>
      </div>
    </main>
  `);
}
window.addStaff = async ()=>{
  const name = document.getElementById('newName').value.trim();
  const dept = document.getElementById('newDept').value;
  const type = document.getElementById('newType').value;
  if(!name){ toast("Enter a name"); return; }
  const staff = await getStaffList();
  staff.push({ id: 's'+Date.now()+Math.floor(Math.random()*1000), name, dept, type });
  await saveStaffList(staff);
  toast("Staff added ✓"); go('admin-staff');
};
window.removeStaff = async (id)=>{
  let staff = await getStaffList();
  staff = staff.filter(s=>s.id!==id);
  await saveStaffList(staff);
  toast("Removed"); go('admin-staff');
};

async function renderAdminClasses(){
  const classes = await getClasses();
  const sel = state.classSel || {dept:DEPARTMENTS[0].code, year:YEARS[0], section:SECTIONS[0]};
  const cid = classId(sel.dept, sel.year, sel.section);
  const existing = classes.find(c=>c.id===cid);
  const students = existing? await getClassStudents(cid): [];
  root(`
    ${Header("Manage Classes")}
    <main>
      ${backLink('admin-home')}
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;">Open / Create a Class</div>
        <div class="field"><label>Department</label>
          <select id="clsDept" onchange="clsSelChange()">${DEPARTMENTS.map(d=>`<option value="${d.code}" ${sel.dept===d.code?'selected':''}>${d.code}</option>`).join('')}</select>
        </div>
        <div class="field"><label>Year</label>
          <select id="clsYear" onchange="clsSelChange()">${YEARS.map(y=>`<option value="${y}" ${sel.year===y?'selected':''}>${y} Year</option>`).join('')}</select>
        </div>
        <div class="field"><label>Section</label>
          <select id="clsSection" onchange="clsSelChange()">${SECTIONS.map(s=>`<option value="${s}" ${sel.section===s?'selected':''}>Section ${s}</option>`).join('')}</select>
        </div>
        <div class="note">${existing? `This class exists with ${students.length} students.`:'This class is not created yet — save a roster below to create it.'}</div>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;">Student Roster — ${sel.dept} ${sel.year} Yr Sec ${sel.section}</div>
        <label>One student name per line</label>
        <textarea id="rosterBox" placeholder="Aarthi S&#10;Bhavya R&#10;Chithra M">${students.map(s=>s.name).join('\\n')}</textarea>
        <button class="btn btn-primary" onclick="saveRoster()">Save Roster</button>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;">All Classes Set Up (${classes.length})</div>
        ${classes.length? `<table><thead><tr><th>Class</th><th>Students</th></tr></thead><tbody>
          ${classes.map(c=>`<tr><td>${c.dept} ${c.year}-${c.section}</td><td>${c.count||0}</td></tr>`).join('')}
        </tbody></table>` : `<div class="empty">No classes created yet.</div>`}
      </div>
    </main>
  `);
}
window.clsSelChange = ()=>{
  state.classSel = {
    dept: document.getElementById('clsDept').value,
    year: document.getElementById('clsYear').value,
    section: document.getElementById('clsSection').value,
  };
  go('admin-classes');
};
window.saveRoster = async ()=>{
  const sel = state.classSel || {dept:DEPARTMENTS[0].code, year:YEARS[0], section:SECTIONS[0]};
  const cid = classId(sel.dept, sel.year, sel.section);
  const names = document.getElementById('rosterBox').value.split('\n').map(n=>n.trim()).filter(Boolean);
  const list = names.map((name,i)=>({id: cid+'-stu'+i, name}));
  await saveClassStudents(cid, list);
  let classes = await getClasses();
  const idx = classes.findIndex(c=>c.id===cid);
  const rec = {id:cid, dept:sel.dept, year:sel.year, section:sel.section, count:list.length};
  if(idx>=0) classes[idx]=rec; else classes.push(rec);
  await saveClasses(classes);
  toast("Roster saved ✓ ("+list.length+" students)");
  go('admin-classes');
};

async function renderAdminPins(){
  const cfg = await getConfig();
  const classes = await getClasses();
  root(`
    ${Header("PINs")}
    <main>
      ${backLink('admin-home')}
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;">Admin PIN</div>
        <input type="text" id="adminPinNew" value="${cfg.adminPin}"/>
        <button class="btn btn-outline" onclick="saveAdminPin()" style="margin-top:8px;">Update</button>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;">Department PINs (HOD login)</div>
        ${DEPARTMENTS.map(d=>`<div class="field"><label>${d.code}</label><input type="text" id="pin_${d.code}" value="${cfg.hodPins[d.code]||'0000'}"/></div>`).join('')}
        <button class="btn btn-primary" onclick="saveHodPins()">Save Department PINs</button>
      </div>
      <div class="card">
        <div style="font-weight:700;margin-bottom:10px;">Class PINs (Class Advisor login)</div>
        ${classes.length? classes.map(c=>`<div class="field"><label>${c.dept} ${c.year}-${c.section}</label><input type="text" id="cpin_${c.id}" value="${cfg.classPins[c.id]||'0000'}"/></div>`).join('') : `<div class="empty">No classes created yet.</div>`}
        ${classes.length? `<button class="btn btn-primary" onclick="saveClassPins()">Save Class PINs</button>`:''}
      </div>
    </main>
  `);
}
window.saveAdminPin = async ()=>{
  const cfg = await getConfig();
  cfg.adminPin = document.getElementById('adminPinNew').value || cfg.adminPin;
  await sset('config', cfg); toast("Admin PIN updated ✓");
};
window.saveHodPins = async ()=>{
  const cfg = await getConfig();
  DEPARTMENTS.forEach(d=>{ const v=document.getElementById('pin_'+d.code).value; if(v) cfg.hodPins[d.code]=v; });
  await sset('config', cfg); toast("Department PINs saved ✓");
};
window.saveClassPins = async ()=>{
  const cfg = await getConfig();
  const classes = await getClasses();
  classes.forEach(c=>{ const el=document.getElementById('cpin_'+c.id); if(el && el.value) cfg.classPins[c.id]=el.value; });
  await sset('config', cfg); toast("Class PINs saved ✓");
};

async function renderAdminOverview(){
  const date = state.ovDate || todayStr();
  const staff = await getStaffList();
  let rows = [];
  for(const dep of DEPARTMENTS){
    const deptStaff = staff.filter(s=>s.dept===dep.code);
    let present=0;
    for(const s of deptStaff){ const a=await getAttendance(s.id, date); if(a && a.morning) present++; }
    rows.push({dep:dep.code, total:deptStaff.length, present});
  }
  root(`
    ${Header("Staff Attendance Overview")}
    <main>
      ${backLink('admin-home')}
      <div class="card">
        <div class="field"><label>Date</label><input type="text" id="ovDateInput" value="${date}" onchange="setOvDate(this.value)"/></div>
        <table><thead><tr><th>Dept</th><th>Total Staff</th><th>Present (Morning)</th></tr></thead>
        <tbody>${rows.map(r=>`<tr><td>${r.dep}</td><td>${r.total}</td><td>${r.total? `<span class="status-pill ${r.present===r.total?'pill-in':'pill-wait'}">${r.present}/${r.total}</span>`:'--'}</td></tr>`).join('')}</tbody></table>
      </div>
    </main>
  `);
}
window.setOvDate = (val)=>{ state.ovDate = val; go('admin-overview'); };

async function renderAdminStudentChart(){
  const date = state.scDate || todayStr();
  const classes = await getClasses();
  const byDept = {};
  for(const dep of DEPARTMENTS) byDept[dep.code] = {classes:[], absent:0, total:0};
  for(const c of classes){
    const students = await getClassStudents(c.id);
    const att = await getStudentAtt(c.id, date) || {};
    const absent = Object.values(att).filter(v=>v==='A').length;
    const total = students.length;
    byDept[c.dept].classes.push({...c, absent, total});
    byDept[c.dept].absent += absent; byDept[c.dept].total += total;
  }
  let html = '';
  for(const dep of DEPARTMENTS){
    const d = byDept[dep.code];
    if(d.total===0 && d.classes.length===0) continue;
    const pct = d.total? Math.round((d.absent/d.total)*100):0;
    html += `<div class="card">
      <div class="grp-head"><span>${dep.code}</span><span>${pct}% absent</span></div>
      <div class="barwrap">
        <div class="barlabel"><span>Overall ${dep.code}</span><span>${d.absent}/${d.total}</span></div>
        <div class="bartrack"><div class="barfill" style="width:${pct}%;background:${barColor(pct)}"></div></div>
      </div>
      ${d.classes.map(c=>{
        const cp = c.total? Math.round((c.absent/c.total)*100):0;
        return `<div class="barwrap"><div class="barlabel"><span>${c.year} Yr - Sec ${c.section}</span><span>${c.absent}/${c.total}</span></div>
        <div class="bartrack"><div class="barfill" style="width:${cp}%;background:${barColor(cp)}"></div></div></div>`;
      }).join('')}
    </div>`;
  }
  root(`
    ${Header("Student Absentee Chart")}
    <main>
      ${backLink('admin-home')}
      <div class="card">
        <div class="field"><label>Date</label><input type="text" id="scDateInput" value="${date}" onchange="setScDate(this.value)"/></div>
        <div class="note">🟢 &le;10% absent &nbsp; 🟠 11–25% &nbsp; 🔴 &gt;25% — colours update automatically as class advisors save daily attendance.</div>
      </div>
      ${html || `<div class="card"><div class="empty">No classes set up yet. Add classes in Manage Classes.</div></div>`}
    </main>
  `);
}
window.setScDate = (val)=>{ state.scDate = val; go('admin-student-chart'); };

// ---------- ROUTER ----------
async function render(){
  if(state.screen==='loading') return renderLoading();
  const [screen, arg] = state.screen.split(':');
  try{
    if(screen==='home') return renderHome();
    if(screen==='staff-dept') return renderStaffDept();
    if(screen==='staff-name') return renderStaffName(arg);
    if(screen==='staff-mark') return renderStaffMark(arg);
    if(screen==='advisor-select') return renderAdvisorSelect();
    if(screen==='advisor-mark') return renderAdvisorMark(arg);
    if(screen==='hod-login') return renderHodLogin();
    if(screen==='hod-dash') return renderHodDash(arg);
    if(screen==='admin-login') return renderAdminLogin();
    if(screen==='admin-home') return renderAdminHome();
    if(screen==='admin-geofence') return renderAdminGeofence();
    if(screen==='admin-staff') return renderAdminStaff();
    if(screen==='admin-classes') return renderAdminClasses();
    if(screen==='admin-pins') return renderAdminPins();
    if(screen==='admin-overview') return renderAdminOverview();
    if(screen==='admin-student-chart') return renderAdminStudentChart();
  }catch(e){
    console.error(e);
    root(`${Header()}<main><div class="card">Something went wrong. <span class="backlink" onclick="go('home')">Go home</span></div></main>`);
  }
}
render();
</script>
